name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job; nothing in CI writes to the repository.
permissions:
  contents: read

# One run per branch or pull request; a newer push cancels an older run of a pull request only.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: "PHP ${{ matrix.php }}: lint + unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment); Dependabot proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mbstring
          coverage: none

      - name: Composer install
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1

      - name: Lint all PHP files
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: PHPUnit
        run: vendor/bin/phpunit

  build-zip:
    name: Build release zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build zip
        run: bin/build-zip.sh

      - name: Upload zip artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp-free-site-cloner
          path: build/*.zip
          if-no-files-found: error
