name: Release

# Publishes the plugin zip, SHA256SUMS and a build provenance attestation
# as a GitHub Release at https://github.com/toby-sutor/wp-free-site-cloner/releases
# when a v* tag is pushed. The tagged commit must be on main and the unit
# suite must pass before anything is built or published.

on:
  push:
    tags:
      - "v*"

# No default token permissions; each job below asks for exactly what it needs.
permissions: {}

# One release run per tag; a running release is never cancelled half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: "PHP ${{ matrix.php }}: unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the code; no write access while tests run
    strategy:
      fail-fast: true
      matrix:
        php: ["7.4", "8.3"]
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment); Dependabot proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mbstring
          coverage: none

      - name: Composer install
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1

      - name: PHPUnit
        run: vendor/bin/phpunit

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload its files
      id-token: write # OIDC token for the provenance attestation
      attestations: write # store the attestation
    steps:
      # Full history so the tagged commit can be compared with main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tagged commit is on main
        run: |
          # fetch-depth 0 fetches all branches as origin/*; fail closed if main is missing.
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "origin/main is not available in this checkout." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to release." >&2
            exit 1
          fi

      - name: Check that the tag matches the plugin version
        run: |
          version=$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' wp-free-site-cloner.php | head -n1 | tr -d '\r[:space:]')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the plugin version $version." >&2
            exit 1
          fi

      - name: Build zip
        run: bin/build-zip.sh

      - name: Write SHA256SUMS
        working-directory: build
        run: |
          sha256sum -- *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/*.zip

      - name: Attach zip and checksums to the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            build/*.zip
            build/SHA256SUMS
          generate_release_notes: true
