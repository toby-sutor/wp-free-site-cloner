# Weekly update PRs for the pinned GitHub Actions (SHA pins are bumped with
# their version comment), the dev-only Composer packages (PHPUnit) and the
# e2e test tooling (playwright-core). None of these ship in the plugin zip.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
